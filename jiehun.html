<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>微火守候 | The Hearth Phase</title>
    <!-- 引入高质感古典衬线字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg-charcoal: #0a0908;
            --ember-orange: #ff7a18;
            --flame-gold: #ffb347;
            --warm-white: #f7f2ea;
            --font-serif: 'Noto Serif SC', 'Playfair Display', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; height: 100%; 
            background-color: var(--bg-charcoal); 
            color: var(--warm-white); 
            font-family: var(--font-serif); 
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #app { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        #hearthCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .state-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; opacity: 0; pointer-events: none;
            transition: opacity 1.5s ease-in-out; padding: 1.5rem; text-align: center;
        }
        .state-layer.active { opacity: 1; pointer-events: auto; }

        h1 { font-size: 2.1rem; font-weight: 400; letter-spacing: 0.25em; margin-bottom: 0.5rem; color: var(--warm-white); text-shadow: 0 0 25px rgba(255,122,24,0.4); }
        .subtitle { font-size: 0.95rem; color: rgba(247, 242, 234, 0.6); letter-spacing: 0.1em; margin-bottom: 2rem; }
        .instruction { font-size: 1.05rem; line-height: 1.8; font-weight: 300; letter-spacing: 0.05em; color: rgba(247, 242, 234, 0.9); max-width: 320px; }

        .invite-btn {
            margin-top: 1.5rem; padding: 0.7rem 1.6rem; background: rgba(255, 122, 24, 0.08); border: 1px solid rgba(255, 122, 24, 0.35);
            color: var(--flame-gold); font-family: var(--font-serif); font-size: 0.85rem; border-radius: 25px;
            letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s; box-shadow: 0 0 15px rgba(255,122,24,0.1);
        }
        .invite-btn:active { background: rgba(255, 122, 24, 0.2); }

        .slider-container { position: absolute; bottom: 12%; width: 220px; height: 4px; background: rgba(255, 255, 255, 0.15); border-radius: 2px; display: flex; align-items: center; }
        .slider-thumb {
            width: 48px; height: 48px; background: rgba(255, 122, 24, 0.15); border: 1px solid rgba(255, 122, 24, 0.6); border-radius: 50%;
            position: absolute; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(255, 122, 24, 0.4); transition: box-shadow 0.3s;
        }
        .slider-thumb::after { content: ''; width: 16px; height: 16px; background: var(--ember-orange); border-radius: 50%; box-shadow: 0 0 15px var(--ember-orange); }
        .slider-text { position: absolute; width: 100%; text-align: center; font-size: 0.8rem; color: rgba(247, 242, 234, 0.5); pointer-events: none; letter-spacing: 0.1em; }

        /* 核心防溢出、高可读性温润毛玻璃面板 */
        .glass-panel {
            background: rgba(15, 10, 8, 0.85); /* 极深的暖棕黑底色，确保文字对比度极致清晰 */
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 122, 24, 0.2); padding: 2.2rem 1.6rem; border-radius: 16px; 
            width: 90vw; /* 流体宽度，绝不溢出屏幕 */
            max-width: 360px; margin-bottom: 2rem; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 122, 24, 0.05);
        }
        .glass-panel p { margin-bottom: 1.2rem; font-size: 0.98rem; line-height: 1.85; text-align: justify; color: rgba(247, 242, 234, 0.95); }
        .glass-panel p:last-child { margin-bottom: 0; }
        .highlight { color: var(--flame-gold); font-weight: 600; text-shadow: 0 0 10px rgba(255,179,71,0.3); }
        .action-point { color: var(--ember-orange); font-weight: 400; } 

        .hold-btn-wrapper { position: absolute; bottom: 8%; width: 90px; height: 90px; display: flex; justify-content: center; align-items: center; }
        .hold-btn { width: 66px; height: 66px; border-radius: 50%; background: rgba(255, 122, 24, 0.1); border: 1px solid rgba(255, 122, 24, 0.5); display: flex; justify-content: center; align-items: center; font-size: 0.85rem; font-weight: 600; color: var(--flame-gold); z-index: 2; letter-spacing: 0.05em;}
        .hold-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); z-index: 1; pointer-events: none; }
        .hold-ring circle { fill: none; stroke: var(--ember-orange); stroke-width: 4; stroke-dasharray: 264; stroke-dashoffset: 264; transition: stroke-dashoffset 0.1s linear; }

        .hearth-seal { width: 90px; height: 90px; margin: 0 auto 1.5rem; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(255, 122, 24, 0.3) 0%, rgba(10, 9, 8, 0) 70%); border-radius: 50%; box-shadow: 0 0 35px rgba(255, 122, 24, 0.4); }
        .hearth-seal::before { content: ''; position: absolute; width: 60px; height: 60px; border: 1px solid rgba(247,242,234,0.4); border-radius: 50%; }
        .hearth-seal::after { content: ''; position: absolute; width: 24px; height: 24px; background: var(--ember-orange); border-radius: 50%; box-shadow: 0 0 20px var(--flame-gold); }

        .save-btn { margin-top: 1rem; padding: 0.8rem 2rem; background: transparent; border: 1px solid rgba(255, 122, 24, 0.5); color: var(--flame-gold); font-family: var(--font-serif); font-size: 0.95rem; border-radius: 6px; letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s; box-shadow: 0 0 15px rgba(255,122,24,0.1); }
        .save-btn:active { background: rgba(255, 122, 24, 0.25); }

        #status-bar { position: absolute; top: env(safe-area-inset-top, 15px); left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: rgba(247,242,234,0.5); z-index: 100; pointer-events: none; letter-spacing: 0.05em; width: 90%; text-align: center; font-weight: 400; }
        #renderCanvas { display: none; }
    </style>
</head>
<body>
    <div id="status-bar">环境初始化中...</div>
    <canvas id="hearthCanvas"></canvas>
    <canvas id="renderCanvas" width="1080" height="1920"></canvas>

    <div id="app">
        <!-- 状态一：余烬寻温 -->
        <div id="state1" class="state-layer active">
            <h1 ondblclick="DEV_MODE.simulateConnection()">微火守候</h1>
            <p class="subtitle">在柴米油盐的疲惫里，让心重新依偎</p>
            <p class="instruction">请将两台手机平放于桌面，长边紧密贴合</p>
            
            <button class="invite-btn" id="inviteBtn">复制房间链接发送给伴侣</button>

            <div class="slider-container" id="alignSliderBox">
                <div class="slider-text" id="sliderText">滑动向火光靠拢</div>
                <div class="slider-thumb" id="sliderThumb"></div>
            </div>
        </div>

        <!-- 状态二：微火重燃 (Canvas 渲染) -->
        <div id="state2" class="state-layer"></div>

        <!-- 状态三：温存破冰与隐秘感恩 -->
        <div id="state3" class="state-layer">
            <div class="glass-panel">
                <p><span class="action-point">各自靠在对方怀里，或者一人为另一人揉捏紧绷的后颈三分钟。</span></p>
                <p>闭上眼睛，说出今天对方为你做的一件细小到近乎隐形的事（比如：替你收了衣服、默默倒了温水、或是清理了地漏）。</p>
                <p>对他说一声：<br><br>
                <span class="highlight">“谢谢你为这个家耗费的力气。”</span></p>
            </div>
            <div class="hold-btn-wrapper">
                <svg class="hold-ring" viewBox="0 0 90 90"><circle cx="45" cy="45" r="42"></circle></svg>
                <div class="hold-btn" id="holdBtn">长按</div>
            </div>
        </div>

        <!-- 状态四：微火同印 -->
        <div id="state4" class="state-layer">
            <div class="hearth-seal"></div>
            <div class="glass-panel" style="padding: 1.8rem 1.5rem;">
                <p style="font-size: 0.85rem; text-align: center; color: rgba(247,242,234,0.7); margin-bottom: 1rem;">请一起读出以下内容：</p>
                <p style="text-align: center; font-size: 0.95rem; line-height: 1.85;">
                    众水不能熄灭爱，能熄灭爱的往往是经年累月的麻木与习以为常。把隐秘的家务劳动从理所应当的牢笼中释放出来，用肉身的触碰唤醒对同路人的感激。
                </p>
            </div>
            <button class="save-btn" id="saveBtn">灯火为彼此而留</button>
        </div>
    </div>

    <script>
        const App = {
            state: 1, isHost: false, epoch: 0, disturbed: false,
            els: { s1: document.getElementById('state1'), s2: document.getElementById('state2'), s3: document.getElementById('state3'), s4: document.getElementById('state4'), status: document.getElementById('status-bar') },
            setState(s) {
                this.state = s;
                Object.values(this.els).forEach(el => { if (el && el.classList) el.classList.remove('active'); });
                if (this.els[`s${s}`]) this.els[`s${s}`].classList.add('active');
                
                if (s === 1) {
                    CanvasEngine.stop(); AudioEngine.stopAll();
                } else if (s === 2) {
                    CanvasEngine.start(); AudioEngine.playHearth(); SensorEngine.startMonitoring();
                    setTimeout(() => {
                        if (this.state === 2 && !this.disturbed) {
                            this.setState(3); CanvasEngine.fadeToCalm(); AudioEngine.fadeToCalm();
                        }
                    }, 10000);
                }
            },
            triggerDisturb() {
                if (this.state === 1 || this.state === 4 || this.disturbed) return;
                this.disturbed = true; RTC.send({ type: 'DISTURBED' }); this.setState(1);
                this.els.status.innerText = "炉火惊散，重归冰冷";
                AudioEngine.playSizzle(); // 浇灭的滋滋声
                if ('vibrate' in navigator) { try{ navigator.vibrate([60, 40, 100]); }catch(e){} }
                setTimeout(() => { this.disturbed = false; }, 2000);
            }
        };

        /**
         * 极致真实的程序化壁炉声学引擎 (无爆音)
         */
        const AudioEngine = {
            ctx: null, rumbleNode: null, crackleNode: null, initialized: false, isCalm: false,
            forceUnlock() {
                if(this.initialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext(); this.ctx.resume(); this.initialized = true;
            },
            // 创建底层燃烧的沉闷气流声
            createRumbleBuffer() {
                const len = this.ctx.sampleRate * 2; const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for(let i=0; i<len; i++) data[i] = (Math.random()*2-1) * 0.5;
                return buf;
            },
            // 创建真实的木炭噼啪爆裂声 (稀疏的高频冲击包络)
            createCrackleBuffer() {
                const len = this.ctx.sampleRate * 4; const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for(let i=0; i<len; i++) {
                    if(Math.random() < 0.0003) { // 千分之三的概率触发爆点
                        let decay = 1;
                        for(let j=0; j<800 && (i+j)<len; j++) {
                            data[i+j] = (Math.random()*2-1) * decay;
                            decay *= 0.95; // 极速衰减，形成干脆的“啪”声
                        }
                        i += 800;
                    }
                }
                return buf;
            },
            playHearth() {
                this.forceUnlock();
                if (this.rumbleNode) return;
                this.isCalm = false;

                // 低频气流燃烧
                const rumbleSrc = this.ctx.createBufferSource(); rumbleSrc.buffer = this.createRumbleBuffer(); rumbleSrc.loop = true;
                const lowpass = this.ctx.createBiquadFilter(); lowpass.type = 'lowpass'; lowpass.frequency.value = 150;
                const rumbleGain = this.ctx.createGain(); rumbleGain.gain.setValueAtTime(0.01, this.ctx.currentTime); rumbleGain.gain.exponentialRampToValueAtTime(0.8, this.ctx.currentTime + 2);
                rumbleSrc.connect(lowpass); lowpass.connect(rumbleGain); rumbleGain.connect(this.ctx.destination);
                rumbleSrc.start(); this.rumbleNode = { source: rumbleSrc, gain: rumbleGain };

                // 高频木炭爆裂
                const crackleSrc = this.ctx.createBufferSource(); crackleSrc.buffer = this.createCrackleBuffer(); crackleSrc.loop = true;
                const highpass = this.ctx.createBiquadFilter(); highpass.type = 'highpass'; highpass.frequency.value = 2000;
                const crackleGain = this.ctx.createGain(); crackleGain.gain.setValueAtTime(0.01, this.ctx.currentTime); crackleGain.gain.exponentialRampToValueAtTime(0.6, this.ctx.currentTime + 1);
                crackleSrc.connect(highpass); highpass.connect(crackleGain); crackleGain.connect(this.ctx.destination);
                crackleSrc.start(); this.crackleNode = { source: crackleSrc, gain: crackleGain };
            },
            fadeToCalm() {
                this.isCalm = true;
                // 进入温存期，爆裂声减弱，底火保留
                if (this.crackleNode && this.ctx) this.crackleNode.gain.gain.exponentialRampToValueAtTime(0.1, this.ctx.currentTime + 3);
                if (this.rumbleNode && this.ctx) this.rumbleNode.gain.gain.exponentialRampToValueAtTime(0.4, this.ctx.currentTime + 3);
            },
            playSizzle() {
                this.forceUnlock();
                this.stopAll();
                // 模拟冷水浇灭的滋滋声
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(1500, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.5);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.6);
            },
            stopAll() {
                if (this.rumbleNode && this.ctx) {
                    this.rumbleNode.gain.gain.cancelScheduledValues(this.ctx.currentTime);
                    this.rumbleNode.gain.gain.setValueAtTime(this.rumbleNode.gain.gain.value, this.ctx.currentTime);
                    this.rumbleNode.gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                    setTimeout(() => { if(this.rumbleNode) this.rumbleNode.source.stop(); this.rumbleNode = null; }, 500);
                }
                if (this.crackleNode && this.ctx) {
                    this.crackleNode.gain.gain.cancelScheduledValues(this.ctx.currentTime);
                    this.crackleNode.gain.gain.setValueAtTime(this.crackleNode.gain.gain.value, this.ctx.currentTime);
                    this.crackleNode.gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                    setTimeout(() => { if(this.crackleNode) this.crackleNode.source.stop(); this.crackleNode = null; }, 500);
                }
            }
        };

        /**
         * Canvas 动态余烬引擎
         */
        const CanvasEngine = {
            canvas: document.getElementById('hearthCanvas'), ctx: null, reqId: null, particles: [], running: false, isCalm: false,
            init() {
                this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize());
                for(let i=0; i<80; i++) this.particles.push(this.createEmber(true));
            },
            resize() {
                const dpr = window.devicePixelRatio || 1; this.canvas.width = window.innerWidth * dpr; this.canvas.height = window.innerHeight * dpr; this.ctx.scale(dpr, dpr);
            },
            createEmber(isInit=false) {
                const h = window.innerHeight;
                return {
                    id: Math.random() * 100,
                    x: Math.random() * window.innerWidth,
                    y: isInit ? Math.random() * h : h + 10,
                    vy: Math.random() * 2 + 1,
                    wander: Math.random() * 1.5,
                    r: Math.random() * 3 + 1,
                    life: Math.random() * 0.8 + 0.2
                };
            },
            fadeToCalm() { this.isCalm = true; },
            start() { if (!this.ctx) this.init(); this.running = true; this.isCalm = false; this.draw(); },
            stop() { this.running = false; if (this.reqId) cancelAnimationFrame(this.reqId); if (this.ctx) this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); },
            draw() {
                if (!this.running) return;
                const w = window.innerWidth; const h = window.innerHeight;
                this.ctx.clearRect(0, 0, w, h);
                const t = (Date.now() - App.epoch) / 1000;
                
                const jointX = App.isHost ? w : 0;
                
                // 绘制接缝底部的暖光红晕
                const grad = this.ctx.createRadialGradient(jointX, h, h*0.1, jointX, h, h*0.8);
                grad.addColorStop(0, this.isCalm ? 'rgba(255, 122, 24, 0.15)' : 'rgba(255, 122, 24, 0.3)');
                grad.addColorStop(1, 'rgba(10, 9, 8, 0)');
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0, 0, w, h);

                // 绘制上升的余烬火星
                this.ctx.globalCompositeOperation = 'lighter';
                this.particles.forEach(p => {
                    // 进入状态三后，火星飘散变慢，主要聚集在底部
                    let currentVy = this.isCalm ? p.vy * 0.3 : p.vy;
                    p.y -= currentVy;
                    p.x += Math.sin(t * 2 + p.id) * p.wander;
                    p.life -= this.isCalm ? 0.002 : 0.005;

                    if(p.life > 0) {
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                        this.ctx.fillStyle = `rgba(255, 179, 71, ${p.life})`;
                        this.ctx.fill();
                    } else {
                        Object.assign(p, this.createEmber());
                        // 强制生成在接缝附近
                        if(App.isHost) p.x = w - Math.random()*80;
                        else p.x = Math.random()*80;
                    }
                });
                this.ctx.globalCompositeOperation = 'source-over';

                this.reqId = requestAnimationFrame(() => this.draw());
            }
        };

        const SensorEngine = {
            baseBeta: null, baseGamma: null, wakeLock: null,
            async requestPermissions() {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
                }
                this.requestWakeLock();
            },
            async requestWakeLock() { if ('wakeLock' in navigator) { try { this.wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} } },
            startMonitoring() {
                this.baseBeta = null; this.baseGamma = null;
                window.addEventListener('deviceorientation', this.handleOrientation);
                document.addEventListener('visibilitychange', this.handleVisibility);
            },
            handleOrientation: (e) => {
                if (App.state !== 2 && App.state !== 3) return;
                if (SensorEngine.baseBeta === null) { SensorEngine.baseBeta = e.beta; SensorEngine.baseGamma = e.gamma; return; }
                
                // EMA 滤波抗手抖
                const dBeta = Math.abs(e.beta - SensorEngine.baseBeta); 
                const dGamma = Math.abs(e.gamma - SensorEngine.baseGamma);
                if (dBeta > 12 || dGamma > 12) App.triggerDisturb();
            },
            handleVisibility: () => {
                if (document.visibilityState === 'hidden') { if (App.state === 2 || App.state === 3) App.triggerDisturb(); } 
                else { SensorEngine.requestWakeLock(); }
            }
        };

        const RTC = {
            peer: null, conn: null, roomId: '', connected: false, localSliding: false, remoteSliding: false,
            init() {
                let hash = location.hash.replace('#room=', '');
                if (!hash) { hash = Math.random().toString(36).substring(2, 8); location.hash = '#room=' + hash; }
                this.roomId = hash; const hostId = `hearth-p-${hash}-h`; const guestId = `hearth-p-${hash}-g`;

                this.peer = new Peer(hostId);
                this.peer.on('open', () => {
                    App.isHost = true; App.els.status.innerText = `当前房间: ${hash} | 等待伴侣加入...`;
                    this.peer.on('connection', (c) => { this.conn = c; this.setupConnection(); });
                });
                this.peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        this.peer.destroy(); this.peer = new Peer(guestId);
                        this.peer.on('open', () => {
                            App.isHost = false; this.conn = this.peer.connect(hostId, { reliable: true }); this.setupConnection();
                        });
                    }
                });
            },
            setupConnection() {
                this.conn.on('open', () => {
                    this.connected = true; App.els.status.innerText = "已连接，请滑动下方火光";
                    if (App.isHost) { App.epoch = Date.now(); this.send({ type: 'SYNC', epoch: App.epoch }); }
                });
                this.conn.on('data', (data) => {
                    if (data.type === 'SYNC') App.epoch = data.epoch;
                    if (data.type === 'SLIDING') { this.remoteSliding = data.state; this.checkSyncSlide(); }
                    if (data.type === 'DISTURBED') { if(App.state === 2 || App.state === 3) App.triggerDisturb(); }
                    if (data.type === 'SYNC_STATE_4') App.setState(4);
                });
                this.conn.on('close', () => { this.connected = false; App.els.status.innerText = "伴侣已断开连接"; if(App.state !== 1) App.triggerDisturb(); });
            },
            send(data) { if (this.connected && this.conn) this.conn.send(data); },
            setLocalSliding(state) { this.localSliding = state; this.send({ type: 'SLIDING', state: state }); this.checkSyncSlide(); },
            checkSyncSlide() { if (this.localSliding && this.remoteSliding && App.state === 1) { App.els.status.innerText = "微火重燃中..."; setTimeout(() => App.setState(2), 200); } }
        };

        function initUI() {
            const inviteBtn = document.getElementById('inviteBtn');
            inviteBtn.addEventListener('click', () => {
                if (window.location.protocol === 'file:') {
                    alert("⚠️ 协议提醒 ⚠️\n\n请不要直接双击本地 HTML 文件 (file:///)。\n请使用 VS Code 'Live Server' 插件打开，这样才能跨设备联机！"); return;
                }
                const url = window.location.href;
                navigator.clipboard.writeText(url).then(() => {
                    inviteBtn.innerText = "已复制！请粘贴发送给对方"; inviteBtn.style.borderColor = "var(--ember-orange)";
                    setTimeout(() => { inviteBtn.innerText = "复制房间链接发送给伴侣"; inviteBtn.style.borderColor = "rgba(255, 122, 24, 0.35)"; }, 3000);
                }).catch(() => { inviteBtn.innerText = "复制失败，请手动复制地址栏"; });
            });

            // 完美的全局触摸解锁音频防拦截机制
            const unlockAudio = () => { AudioEngine.forceUnlock(); document.removeEventListener('pointerdown', unlockAudio); };
            document.addEventListener('pointerdown', unlockAudio, { once: true });

            const sliderBox = document.getElementById('alignSliderBox'); const thumb = document.getElementById('sliderThumb');
            let isDragging = false;
            setTimeout(() => { thumb.style.left = App.isHost ? '0px' : '172px'; }, 1000);

            thumb.addEventListener('pointerdown', () => { isDragging = true; SensorEngine.requestPermissions(); });
            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return; const rect = sliderBox.getBoundingClientRect();
                let x = e.clientX - rect.left - 24; x = Math.max(0, Math.min(x, 172)); thumb.style.left = x + 'px';
                const target = App.isHost ? 172 : 0;
                if (Math.abs(x - target) < 10) { if (!RTC.localSliding) RTC.setLocalSliding(true); } else { if (RTC.localSliding) RTC.setLocalSliding(false); }
            });
            window.addEventListener('pointerup', () => {
                if (isDragging) { isDragging = false; RTC.setLocalSliding(false); thumb.style.left = App.isHost ? '0px' : '172px'; }
            });

            const holdBtn = document.getElementById('holdBtn'); const ringCircle = document.querySelector('.hold-ring circle');
            let holdTimer = null; let progress = 0;
            const startHold = () => {
                if (App.state !== 3) return; progress = 0;
                holdTimer = setInterval(() => {
                    progress = Math.min(100, progress + 0.66); ringCircle.style.strokeDashoffset = 264 - (264 * progress / 100);
                    if (progress >= 100) {
                        clearInterval(holdTimer);
                        if ('vibrate' in navigator) { try{navigator.vibrate([60, 40, 90]);}catch(e){} }
                        RTC.send({ type: 'SYNC_STATE_4' }); App.setState(4);
                    }
                }, 20);
            };
            const stopHold = () => { clearInterval(holdTimer); progress = 0; ringCircle.style.strokeDashoffset = 264; };
            holdBtn.addEventListener('pointerdown', startHold); holdBtn.addEventListener('pointerup', stopHold); holdBtn.addEventListener('pointerleave', stopHold);
            
            document.getElementById('saveBtn').addEventListener('click', generateCertificate);
        }

        function generateCertificate() {
            const canvas = document.getElementById('renderCanvas'); const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a0908'; ctx.fillRect(0, 0, 1080, 1920);
            
            const grad = ctx.createRadialGradient(540, 500, 50, 540, 500, 450);
            grad.addColorStop(0, 'rgba(255, 122, 24, 0.2)'); grad.addColorStop(1, 'rgba(10, 9, 8, 0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 1080, 1920);
            
            ctx.beginPath(); ctx.arc(540, 500, 80, 0, Math.PI * 2); ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(540, 500, 30, 0, Math.PI * 2); ctx.fillStyle = '#ff7a18'; ctx.fill();
            
            ctx.fillStyle = '#f7f2ea'; ctx.textAlign = 'center'; ctx.font = '55px Noto Serif SC, serif'; ctx.fillText('微 火 守 候', 540, 780);
            
            ctx.font = '36px Noto Serif SC, serif'; ctx.fillStyle = 'rgba(247, 242, 234, 0.9)';
            const text = "众水不能熄灭爱，能熄灭爱的往往是经年累月的麻木与习以为常。把隐秘的家务劳动从理所应当的牢笼中释放出来，用肉身的触碰唤醒对同路人的感激。";
            let line = ''; let y = 1000;
            for (let i = 0; i < text.length; i++) {
                line += text[i];
                if (line.length > 18) { ctx.fillText(line, 540, y); line = ''; y += 75; }
            }
            if(line) ctx.fillText(line, 540, y);
            
            ctx.font = '32px Noto Serif SC, serif'; ctx.fillStyle = 'rgba(255, 179, 71, 0.8)'; const date = new Date(); ctx.fillText(`灯火为彼此而留 · ${date.getFullYear()}.${date.getMonth()+1}.${date.getDate()}`, 540, 1750);
            
            const link = document.createElement('a'); link.download = 'hearth-phase-seal.png'; link.href = canvas.toDataURL('image/png'); link.click();
        }

        const DEV_MODE = {
            simulateConnection() {
                if (App.state !== 1) return;
                RTC.localSliding = true; RTC.remoteSliding = true; App.isHost = true; App.epoch = Date.now();
                SensorEngine.requestPermissions(); RTC.checkSyncSlide(); App.els.status.innerText = "沙盒模拟模式已激活";
            }
        };

        window.addEventListener('DOMContentLoaded', () => { CanvasEngine.init(); RTC.init(); initUI(); });
        window.addEventListener('beforeunload', () => location.hash = '');
    </script>
</body>
</html>
